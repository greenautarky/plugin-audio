# GA armv7 rebuild of the upstream audio plugin.
# Same structure as plugin-cli / plugin-dns build-ga-armv7.yml: rebuild the
# pinned upstream tag's source under our namespace on current Alpine packages,
# gated by an /init smoke, a fail-closed CVE gate and a tag-must-match-env guard.
# version == docker tag == io.hass.version label (the Supervisor pulls by the
# version string and reads the label for its already-installed check).
#
# A pull request runs the same build, smoke and CVE gate WITHOUT publishing,
# and keeps the built image as a short-lived workflow artifact so it can be
# inspected before a release is cut. Publishing stays a workflow_dispatch.
name: Build GA armv7 audio plugin

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Must equal PUBLISH_VERSION below (guard against accidental minting)"
        required: true
  pull_request:
    branches: [ga-armv7]

env:
  PUBLISH_VERSION: "2025.08.1"
  UPSTREAM_VERSION: "2025.08.0"
  PULSE_VERSION: "17.0"
  # Digest-pinned: :3.22 is a floating tag.
  BUILD_FROM: "ghcr.io/home-assistant/armv7-base:3.22@sha256:ae2b8be31fee7bd01078d5ca51e7c48aa323ccbaca8085420a416e354b101246"
  IMAGE: "ghcr.io/greenautarky/armv7-hassio-audio"
  # Pinned expectation for the CVE gate: every Go binary this image ships.
  EXPECTED_GO_BINARIES: "usr/bin/tempio"

permissions:
  contents: read
  packages: write

jobs:
  build-prove-push:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - release_tag must match the pinned version
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.release_tag }}" != "${PUBLISH_VERSION}" ]; then
            echo "::error::release_tag '${{ inputs.release_tag }}' != pinned PUBLISH_VERSION '${PUBLISH_VERSION}' - refusing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build (armv7, upstream source at parity)
        run: |
          docker buildx build --platform linux/arm/v7 --load \
            --build-arg BUILD_FROM="${BUILD_FROM}" \
            --build-arg BUILD_ARCH=armv7 \
            --build-arg PULSE_VERSION="${PULSE_VERSION}" \
            --label io.hass.type=audio \
            --label io.hass.arch=armv7 \
            --label io.hass.version="${PUBLISH_VERSION}" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.version="${PUBLISH_VERSION}" \
            --label ga.upstream.version="${UPSTREAM_VERSION}" \
            -t "${IMAGE}:${PUBLISH_VERSION}" .

      - name: Smoke - /init boot, pulseaudio serving its socket
        run: |
          # No sound hardware and no system D-Bus on the runner: the bluetooth
          # module fails to load (as on any host without D-Bus) and pulseaudio
          # still has to come up and serve its socket.
          docker run -d --name smoke --platform linux/arm/v7 "${IMAGE}:${PUBLISH_VERSION}"
          ok=""
          for _ in $(seq 1 40); do
            if docker exec smoke sh -c 'test -S /data/external/pulse.sock' 2>/dev/null; then ok=1; break; fi
            sleep 3
          done
          state=$(docker inspect smoke --format '{{.State.Status}}')
          echo "state=$state"
          docker logs smoke 2>&1 | tail -25
          if docker logs smoke 2>&1 | grep -qiE "permission denied|exited 126"; then
            echo "::error::exec-bit class failure in /init boot"; exit 1
          fi
          [ "$state" = "running" ] || { echo "::error::container not running"; exit 1; }
          [ -n "$ok" ] || { echo "::error::pulseaudio socket never appeared"; exit 1; }
          docker exec smoke sh -c 'pgrep -x pulseaudio >/dev/null' || { echo "::error::pulseaudio not running under s6"; exit 1; }
          docker exec smoke pactl -s /data/external/pulse.sock info || { echo "::error::pulseaudio does not answer on its socket"; exit 1; }
          docker exec smoke sh -c 'test -x /usr/bin/tempio' || { echo "::error::tempio missing"; exit 1; }
          docker rm -f smoke

      - name: Save the built image
        run: docker save "${IMAGE}:${PUBLISH_VERSION}" -o "image.tar"

      - name: CVE gate (D1 - block on CRITICAL with a fix; HIGH reported)
        env:
          # Digest-pinned scanner, same image the OS repo's scan-cves.sh uses.
          TRIVY_IMAGE: "aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969"
        run: |
          docker run --rm -v "$PWD:/work" -w /work "${TRIVY_IMAGE}" \
            image --quiet --input image.tar --format json --output scan.json
          python3 - <<'PY'
          import json, os
          d = json.load(open("scan.json"))
          results = d.get("Results") or []
          evaluated = sum(len(r.get("Packages") or []) for r in results)
          vulns = [(r["Target"], v) for r in results for v in (r.get("Vulnerabilities") or [])]
          counts = {}
          for _, v in vulns:
              counts[v["Severity"]] = counts.get(v["Severity"], 0) + 1
          print(f"results={len(results)} findings={counts}")
          if not results:
              raise SystemExit("COVERAGE ZERO - a scan that inspected nothing is a failure, not a pass")
          # Every Go binary this image is known to ship must have been evaluated.
          # The list is pinned here, never derived from the scan it checks.
          expected = set(os.environ["EXPECTED_GO_BINARIES"].split())
          seen = {r["Target"] for r in results if r.get("Type") == "gobinary"}
          print(f"go binaries evaluated: {sorted(seen)}")
          missing = expected - seen
          if missing:
              raise SystemExit(f"Go binaries NOT evaluated by the scanner: {sorted(missing)}")
          # Counts only: this log is public. Per-finding detail comes from the
          # scanner run against the saved image, not from a public CI log.
          blocking = [v for _, v in vulns if v["Severity"] == "CRITICAL" and v.get("FixedVersion")]
          if blocking:
              raise SystemExit(f"POLICY BLOCK: {len(blocking)} CRITICAL finding(s) with a fix available")
          print("policy: no CRITICAL finding with a fix available")
          PY

      - name: Upload the built image (pull request only, not a release)
        if: github.event_name == 'pull_request'
        run: mv image.tar "armv7-hassio-audio_${PUBLISH_VERSION}.tar"

      - name: Upload artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: armv7-hassio-audio-image
          path: armv7-hassio-audio_${{ env.PUBLISH_VERSION }}.tar
          retention-days: 7

      - name: Push
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${IMAGE}:${PUBLISH_VERSION}"
